name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel wayland wayland-protocols
      - name: Build
        run: make -C game CFLAGS="-O2 -Wall -Wextra -Werror"
      - name: Headless gameplay tests
        run: make -C game check
